name: Publicar en Instagram

# Corre cada hora y publica solo lo que ya llegó a su horario dentro de un lote
# aprobado. El cron de GitHub es UTC; Mendoza es UTC-3, pero el script compara
# contra la hora local de la zona configurada en config.json, así que la
# frecuencia horaria alcanza sin tener que traducir el cron a mano.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin publicar"
        type: boolean
        default: true

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Se verifica SIEMPRE antes de publicar, no solo al generar: una regla
      # nueva (nacida de una corrección de Nicolás) puede haber aparecido después
      # de que el lote se armó. El `|| true` es a propósito — un bloqueo no debe
      # cortar el workflow, sino dejar el lote sin auto-aprobar, que es lo que
      # publicar.py comprueba a continuación.
      - name: Verificar contra las reglas de marca
        run: python3 scripts/verificar.py || true

      - name: Publicar lo que corresponda
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/publicar.py

      - name: Guardar el resultado de la verificación
        if: always()
        run: |
          git config user.name "AKYRA Motor de Redes"
          git config user.email "motor@akyra.local"
          git add cola.json
          git diff --staged --quiet || git commit -m "Verificación del lote (automático)"
          git push || true
